[Regen]
; Enable natural HP regeneration while alive (F5 toggles in-game)
hp_regen_enabled = 1
; Percent of Max HP regenerated per second
hp_regen_percent_per_sec = 2.0

[General]
; Play subtle Windows beep cue when toggling F5
sound_enabled = 1
; Optional: chain another dinput8.dll (e.g., DS3 Mod Engine)
chain_dinput8_dll =

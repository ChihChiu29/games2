[Regen]
; Enable natural HP regeneration while alive (F5 toggles in-game)
hp_regen_enabled = 1
; Percent of Max HP regenerated per second (DS1 mod was ~2.0)
hp_regen_percent_per_sec = 2.0

[LevelUpRoll]
; Enable 50/50 random upgrade whenever your XP bar fills for a Skill Point (F6 toggles in-game)
enabled = 1
; Chance (0-100) to roll +1 Attack Power; otherwise rolls +hp_bonus_percent% Max HP
; (Automatically falls back to Max HP if Attack Power reaches 99)
attack_roll_chance = 50
; Bonus Max HP percentage gained per Max HP roll (stacks additively on base Max HP)
hp_bonus_percent = 5.0

[General]
; Play subtle Windows beep cues (high chime = Attack Power, warm chime = Max HP)
sound_enabled = 1
; Optional: chain another dinput8.dll (e.g., Sekiro Mod Engine renamed to modengine_dinput8.dll)
chain_dinput8_dll =
